[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-python"
version = "0.1.0"
description = "Production grade resilience patterns for Python: retries with backoff and jitter, circuit breaker, token bucket rate limiter, idempotency keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sai Tarrun Pitta" }]
keywords = [
  "resilience",
  "resilience-patterns",
  "retry",
  "exponential-backoff",
  "jitter",
  "circuit-breaker",
  "rate-limit",
  "rate-limiter",
  "token-bucket",
  "idempotency",
  "idempotency-key",
  "distributed-systems",
  "fault-tolerance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/saitarrun/resilient-python"
Repository = "https://github.com/saitarrun/resilient-python"

[tool.setuptools.packages.find]
include = ["resilient*"]
